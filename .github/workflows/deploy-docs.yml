name: Deploy Docs
on:
  push:
    branches:
      - Dev
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy CHANGELOG to docs
        run: |
          cat << 'EOF' > docs-site/docs/changelog.md
          ---
          title: Changelog
          ---

          EOF
          cat CHANGELOG.md >> docs-site/docs/changelog.md

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs-site/build
